<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #15202b;
      color: #e7e9ea;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(139, 152, 165, 0.2);
    }
    .row:last-child {
      border-bottom: none;
    }
    .label {
      font-size: 14px;
    }
    .desc {
      font-size: 11px;
      color: #8b98a5;
      margin-top: 2px;
    }
    /* Toggle switch */
    .toggle {
      position: relative;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #38444d;
      border-radius: 24px;
      transition: 0.3s;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #e7e9ea;
      border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider {
      background-color: rgb(29, 155, 240);
    }
    input:checked + .slider::before {
      transform: translateX(18px);
    }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #8b98a5;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>트윗 번역기</h1>

  <div class="row">
    <div>
      <div class="label">번역 활성화</div>
      <div class="desc">ON/OFF</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <div>
      <div class="label">자동 번역</div>
      <div class="desc">버튼 없이 자동 번역</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="autoToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">by shud26</div>

  <script src="popup.js"></script>
</body>
</html>
